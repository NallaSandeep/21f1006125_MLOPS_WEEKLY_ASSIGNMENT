name: CI with DVC and CML

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Authenticate to Google Cloud using Workload Identity Federation
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Install gcloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-json-report
          pip install dvc-gs
          pip install cml

      # Verify authentication (optional)
      - name: Verify GCP Authentication
        run: |
          gcloud auth list

      # Pull versioned data/model from GCS
      - name: Pull DVC Artifacts
        run: |
          dvc pull

      # Run unit tests
      - name: Run Tests
        run: |
          pytest -v --json-report --json-report-file=test-report.json

      # Evaluate model
      - name: Evaluate Model
        run: |
          python evaluate.py > metrics.txt

      # Generate report
      - name: Generate Report
        run: |
          echo "# CI Test Report" > report.md
          echo "" >> report.md

          echo "## Test Status" >> report.md
          if grep -q '"failed": 0' test-report.json; then
            echo "✅ All tests passed" >> report.md
          else
            echo "❌ Some tests failed" >> report.md
          fi

          echo "" >> report.md
          echo "## Model Metrics" >> report.md
          cat metrics.txt >> report.md

      # Publish report to Pull Request
      - name: Publish CML Report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md